<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="g-use-title g-use-desc" font-family="Barlow, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="g-use-title">Using the console</title>
<desc id="g-use-desc">Hover moves the iPhone's pointer. A click taps. A drag swipes, and a list keeps its speed. The wheel scrolls. Typing, after a click on the screen, types on the iPhone.</desc>
<style>
  .g-card { fill: #1e2b30; }
  .g-cap { font-size: 16px; font-weight: 600; fill: #f4f1ec; }
  .g-sub { font-size: 13px; fill: #a7b4b8; }
  .g-cursor { fill: #fff; stroke: #1d2a2f; stroke-width: 1.4; stroke-linejoin: round; }
  .g-dot { fill: #fff; fill-opacity: 0.65; stroke: #000; stroke-opacity: 0.3; }
  .g-row { fill: #fff; fill-opacity: 0.9; }
  /* 1 hover: the pointer follows the mouse */
  .g-hover-mouse { animation: g-hover 4s ease-in-out infinite; }
  .g-hover-dot { animation: g-hover 4s ease-in-out infinite; animation-delay: 0.12s; }
  @keyframes g-hover { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(44px, 30px); }
    50% { transform: translate(10px, 92px); } 75% { transform: translate(-26px, 40px); } }
  /* 2 click: a tap where the mouse is */
  .g-click-mouse { animation: g-press 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 0; }
  .g-ripple { fill: none; stroke: #fff; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center;
    animation: g-ripple 2.4s ease-out infinite; }
  .g-app { animation: g-lit 2.4s ease-in-out infinite; }
  @keyframes g-press { 0%, 38%, 52%, 100% { transform: scale(1); } 45% { transform: scale(0.82); } }
  @keyframes g-ripple { 0%, 42% { opacity: 0; transform: scale(0.3); } 48% { opacity: 0.9; } 80%, 100% { opacity: 0; transform: scale(2.2); } }
  @keyframes g-lit { 0%, 42%, 90%, 100% { fill-opacity: 0.35; } 48%, 80% { fill-opacity: 1; } }
  /* 3 drag: the finger stays down while the mouse moves, and the list follows with its speed */
  .g-drag-mouse { animation: g-drag 3.2s ease-in-out infinite; }
  .g-drag-list { animation: g-fling 3.2s cubic-bezier(0.2, 0.7, 0.2, 1) infinite; }
  .g-trail { fill: none; stroke: #7ccf95; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: g-trail 3.2s ease-in-out infinite; }
  @keyframes g-drag { 0%, 12% { transform: translate(0, 0); } 45% { transform: translate(0, -96px); } 60%, 100% { transform: translate(0, -96px); } }
  @keyframes g-fling { 0%, 12% { transform: translate(0, 0); } 45% { transform: translate(0, -96px); } 80%, 92% { transform: translate(0, -170px); } 100% { transform: translate(0, 0); } }
  @keyframes g-trail { 0%, 12% { stroke-dashoffset: 1; opacity: 1; } 45% { stroke-dashoffset: 0; opacity: 1; } 70%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  /* 4 wheel */
  .g-wheel-list { animation: g-scroll 3s ease-in-out infinite; }
  .g-wheel-mark { animation: g-roll 3s linear infinite; }
  @keyframes g-scroll { 0%, 10% { transform: translate(0, 0); } 45%, 55% { transform: translate(0, -80px); } 90%, 100% { transform: translate(0, 0); } }
  @keyframes g-roll { 0%, 10% { transform: translate(0, 0); } 45% { transform: translate(0, 7px); } 45.01% { transform: translate(0, -7px); }
    55% { transform: translate(0, -7px); } 90% { transform: translate(0, 7px); } 90.01%, 100% { transform: translate(0, 0); } }
  /* 5 type */
  .g-typed { animation: g-type 4s steps(10, end) infinite; }
  .g-key { animation: g-keydown 0.4s steps(1) infinite; }
  .g-key:nth-of-type(2) { animation-delay: 0.1s; } .g-key:nth-of-type(3) { animation-delay: 0.2s; } .g-key:nth-of-type(4) { animation-delay: 0.3s; }
  .g-caret { animation: g-blink 1s steps(1) infinite; }
  .g-caret-move { animation: g-caret 4s steps(10, end) infinite; }
  @keyframes g-type { 0% { width: 0; } 70%, 100% { width: 84px; } }
  @keyframes g-caret { 0% { transform: translate(0, 0); } 70%, 100% { transform: translate(84px, 0); } }
  @keyframes g-keydown { 0% { fill: #7ccf95; } 50% { fill: #44585f; } }
  @keyframes g-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .g-typed { width: 84px; } }
</style>
<defs>
  <linearGradient id="g-use-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4c57d8"/><stop offset="0.6" stop-color="#7a4fc9"/><stop offset="1" stop-color="#b45aa0"/>
  </linearGradient>
  <symbol id="g-use-cursor" viewBox="0 0 14 22" overflow="visible"><path class="g-cursor" d="M0 0V17.5L4.4 13.3L7.3 20.4L10.2 19.2L7.3 12.2H13z"/></symbol>
  <symbol id="g-use-phone" viewBox="0 0 120 200" overflow="visible">
    <rect width="120" height="200" rx="22" fill="#bdb6aa"/><rect x="5" y="5" width="110" height="190" rx="18" fill="#0b0b0c"/>
    <rect x="46" y="12" width="28" height="8" rx="4" fill="#000"/>
  </symbol>
  <clipPath id="g-use-screen"><rect x="10" y="10" width="100" height="180" rx="14"/></clipPath>
</defs>

<rect width="1040" height="420" rx="24" fill="#26363c"/>
<text x="40" y="52" font-size="26" font-weight="600" fill="#f4f1ec">Using the console</text>
<text x="40" y="78" class="g-sub" font-size="15">The mouse and the keyboard act on the iPhone as they move</text>

<!-- 1 hover -->
<g transform="translate(28 104)">
  <rect class="g-card" width="184" height="292" rx="16"/>
  <g transform="translate(32 20)"><use href="#g-use-phone" width="120" height="200"/>
    <g clip-path="url(#g-use-screen)"><rect x="10" y="10" width="100" height="180" fill="url(#g-use-wall)"/>
      <g class="g-hover-dot"><circle cx="42" cy="62" r="10" class="g-dot"/></g></g>
    <g class="g-hover-mouse"><use href="#g-use-cursor" x="46" y="66" width="14" height="22"/></g>
  </g>
  <text x="92" y="252" text-anchor="middle" class="g-cap">Hover</text>
  <text x="92" y="274" text-anchor="middle" class="g-sub">moves the pointer</text>
</g>

<!-- 2 click -->
<g transform="translate(236 104)">
  <rect class="g-card" width="184" height="292" rx="16"/>
  <g transform="translate(32 20)"><use href="#g-use-phone" width="120" height="200"/>
    <g clip-path="url(#g-use-screen)"><rect x="10" y="10" width="100" height="180" fill="url(#g-use-wall)"/>
      <rect x="22" y="40" width="20" height="20" rx="5" fill="#8e8e93"/><rect x="50" y="40" width="20" height="20" rx="5" class="g-app" fill="#ffcc00"/>
      <rect x="78" y="40" width="20" height="20" rx="5" fill="#0a84ff"/><rect x="22" y="70" width="20" height="20" rx="5" fill="#34c759"/>
      <rect x="50" y="70" width="20" height="20" rx="5" fill="#ff2d55"/><rect x="78" y="70" width="20" height="20" rx="5" fill="#5ac8fa"/>
      <circle cx="60" cy="50" r="12" class="g-ripple"/></g>
    <g transform="translate(62 52)"><g class="g-click-mouse"><use href="#g-use-cursor" x="0" y="0" width="14" height="22"/></g></g>
  </g>
  <text x="92" y="252" text-anchor="middle" class="g-cap">Click</text>
  <text x="92" y="274" text-anchor="middle" class="g-sub">taps</text>
</g>

<!-- 3 drag -->
<g transform="translate(444 104)">
  <rect class="g-card" width="184" height="292" rx="16"/>
  <g transform="translate(32 20)"><use href="#g-use-phone" width="120" height="200"/>
    <g clip-path="url(#g-use-screen)"><rect x="10" y="10" width="100" height="180" fill="#f2f2f7"/>
      <g class="g-drag-list">
        <rect x="16" y="24" width="88" height="14" rx="3" class="g-row" fill="#fff"/><rect x="16" y="44" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="64" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="84" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="104" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="124" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="144" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="164" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="184" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="204" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="224" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="244" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="264" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="284" width="88" height="14" rx="3" fill="#fff"/>
        <rect x="16" y="304" width="88" height="14" rx="3" fill="#fff"/><rect x="16" y="324" width="88" height="14" rx="3" fill="#fff"/>
        <g fill="#c7c7cc"><rect x="22" y="29" width="30" height="4" rx="2"/><rect x="22" y="49" width="40" height="4" rx="2"/>
          <rect x="22" y="69" width="26" height="4" rx="2"/><rect x="22" y="89" width="36" height="4" rx="2"/><rect x="22" y="109" width="30" height="4" rx="2"/>
          <rect x="22" y="129" width="42" height="4" rx="2"/><rect x="22" y="149" width="28" height="4" rx="2"/><rect x="22" y="169" width="34" height="4" rx="2"/>
          <rect x="22" y="189" width="30" height="4" rx="2"/><rect x="22" y="209" width="40" height="4" rx="2"/><rect x="22" y="229" width="26" height="4" rx="2"/>
          <rect x="22" y="249" width="36" height="4" rx="2"/><rect x="22" y="269" width="30" height="4" rx="2"/><rect x="22" y="289" width="42" height="4" rx="2"/>
          <rect x="22" y="309" width="28" height="4" rx="2"/><rect x="22" y="329" width="34" height="4" rx="2"/></g>
      </g>
      <path class="g-trail" pathLength="1" d="M66 166V70"/></g>
    <g class="g-drag-mouse"><use href="#g-use-cursor" x="64" y="164" width="14" height="22"/></g>
  </g>
  <text x="92" y="252" text-anchor="middle" class="g-cap">Drag</text>
  <text x="92" y="274" text-anchor="middle" class="g-sub">swipes; lists keep their speed</text>
</g>

<!-- 4 wheel -->
<g transform="translate(652 104)">
  <rect class="g-card" width="184" height="292" rx="16"/>
  <g transform="translate(20 20)"><use href="#g-use-phone" width="120" height="200"/>
    <g clip-path="url(#g-use-screen)"><rect x="10" y="10" width="100" height="180" fill="#f2f2f7"/>
      <g class="g-wheel-list">
        <rect x="16" y="24" width="88" height="30" rx="4" fill="#fff"/><rect x="16" y="60" width="88" height="30" rx="4" fill="#fff"/>
        <rect x="16" y="96" width="88" height="30" rx="4" fill="#fff"/><rect x="16" y="132" width="88" height="30" rx="4" fill="#fff"/>
        <rect x="16" y="168" width="88" height="30" rx="4" fill="#fff"/><rect x="16" y="204" width="88" height="30" rx="4" fill="#fff"/>
        <rect x="16" y="240" width="88" height="30" rx="4" fill="#fff"/>
        <g fill="#0a84ff"><rect x="22" y="31" width="16" height="16" rx="4"/><rect x="22" y="67" width="16" height="16" rx="4" fill="#ff9500"/>
          <rect x="22" y="103" width="16" height="16" rx="4" fill="#34c759"/><rect x="22" y="139" width="16" height="16" rx="4" fill="#ff2d55"/>
          <rect x="22" y="175" width="16" height="16" rx="4"/><rect x="22" y="211" width="16" height="16" rx="4" fill="#af52de"/>
          <rect x="22" y="247" width="16" height="16" rx="4" fill="#ffcc00"/></g>
      </g></g>
  </g>
  <g transform="translate(146 70)">
    <rect width="28" height="46" rx="14" fill="#e9ecee" stroke="#1d2a2f" stroke-width="1.4"/>
    <path d="M14 0V16" stroke="#1d2a2f" stroke-width="1.4"/>
    <rect x="11" y="6" width="6" height="12" rx="3" fill="#44585f"/>
    <g class="g-wheel-mark"><rect x="12.5" y="9" width="3" height="3" rx="1.5" fill="#e9ecee"/></g>
  </g>
  <text x="92" y="252" text-anchor="middle" class="g-cap">Wheel</text>
  <text x="92" y="274" text-anchor="middle" class="g-sub">scrolls</text>
</g>

<!-- 5 type -->
<g transform="translate(860 104)">
  <rect class="g-card" width="152" height="292" rx="16"/>
  <g transform="translate(16 10)"><use href="#g-use-phone" width="120" height="200"/>
    <g clip-path="url(#g-use-screen)"><rect x="10" y="10" width="100" height="180" fill="#fff"/>
      <text x="16" y="44" font-size="15" font-weight="700" fill="#000">Notes</text>
      <clipPath id="g-use-typed"><rect class="g-typed" x="16" y="56" width="0" height="18"/></clipPath>
      <text x="16" y="70" font-size="13" fill="#1d1d1f" clip-path="url(#g-use-typed)">hello, iPhone</text>
      <g class="g-caret-move"><rect x="17" y="58" width="1.6" height="14" fill="#0a84ff" class="g-caret"/></g>
    </g>
  </g>
  <g transform="translate(22 216)" font-size="10" font-weight="600" text-anchor="middle">
    <rect class="g-key" width="24" height="18" rx="4" fill="#44585f"/><rect class="g-key" x="28" width="24" height="18" rx="4" fill="#44585f"/>
    <rect class="g-key" x="56" width="24" height="18" rx="4" fill="#44585f"/><rect class="g-key" x="84" width="24" height="18" rx="4" fill="#44585f"/>
    <text x="12" y="13" fill="#f4f1ec">H</text><text x="40" y="13" fill="#f4f1ec">E</text><text x="68" y="13" fill="#f4f1ec">L</text><text x="96" y="13" fill="#f4f1ec">O</text>
  </g>
  <text x="76" y="252" text-anchor="middle" class="g-cap">Type</text>
  <text x="76" y="274" text-anchor="middle" class="g-sub">after a click on it</text>
</g>
</svg>
