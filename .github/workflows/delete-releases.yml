# Delete every release and its tag except one. Run by hand ("Run workflow") with the tag to keep.
name: Delete old releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Release tag to keep, e.g. v0.2.0 (every other release and its tag is deleted)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the other releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep }}
        run: |
          # refuse to run unless the release to keep exists
          gh release view "$KEEP" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            [ "$tag" = "$KEEP" ] && continue
            echo "deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          gh release list --repo "$GITHUB_REPOSITORY"
