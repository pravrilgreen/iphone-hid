# Remove a release and its tag, by hand ("Run workflow"): for a release that should not have been
# published, or after the version numbers started again.
name: Remove a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to remove, with its git tag, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          fi
          echo "removed $TAG"
