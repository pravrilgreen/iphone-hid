# Lint and tests on every push and pull request (releases have their own workflow: release.yml).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  box:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: box/go.mod
          cache-dependency-path: box/go.sum
      - name: libjpeg-turbo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0-dev
      - name: Format and vet
        run: |
          test -z "$(gofmt -l box)" || { gofmt -l box; exit 1; }
          cd box && go vet ./...
          GOOS=darwin go vet ./...  # the simulated box runs on a developer's Mac too
      - name: Tests (Go image/jpeg)
        run: cd box && go test -race ./...
      - name: Tests (libjpeg-turbo)
        run: cd box && go test -race -tags turbojpeg ./...

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck (the installer, the bundle header and the scripts)
        run: shellcheck -S style packaging/*.sh scripts/*.sh

  sdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: box/go.mod
          cache-dependency-path: box/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: The box binary for the tests
        run: cd box && go build -o "$RUNNER_TEMP/ihcd" ./cmd/ihcd && echo "IHCD=$RUNNER_TEMP/ihcd" >> "$GITHUB_ENV"
      - name: Tests (the SDK against a simulated box)
        run: python -m pytest -q
