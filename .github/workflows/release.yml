# Build the box bundle (static ARM64 ihcd with libjpeg-turbo), smoke-test it under emulation, and
# publish it as a release. Runs when a version tag (v0.1.0, ...) is pushed, or by hand ("Run
# workflow"): then the release and its tag are created at the head of the branch it runs on.
# Versions 0.x are published as pre-releases.
name: Release box bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 (created at this branch's head if it does not exist)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: '[ "$TAG" = "v$(cat VERSION)" ] || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }'

      - uses: actions/setup-go@v5
        with:
          go-version-file: box/go.mod
          cache-dependency-path: box/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libturbojpeg0-dev qemu-user cmake
          pip install "ziglang==0.13.0" -e ".[dev]"

      - name: Tests
        run: |
          (cd box && go vet ./... && go test -race -tags turbojpeg ./...)
          (cd box && go build -o "$RUNNER_TEMP/ihcd" ./cmd/ihcd)
          IHCD="$RUNNER_TEMP/ihcd" python -m pytest -q

      - name: Build the ARM64 bundle
        run: ARCH=arm64 scripts/build_box.sh

      - name: Smoke-test it under ARM64 emulation
        run: scripts/check_box.sh "dist/ihc-box-$(cat VERSION)-linux-arm64.run"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.run > SHA256SUMS)
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "iphone-hid $TAG" --notes-file RELEASE_NOTES.md $pre
          gh release upload "$TAG" dist/*.run dist/SHA256SUMS --clobber
