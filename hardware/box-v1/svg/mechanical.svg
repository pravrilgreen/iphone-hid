<text x="80.0" y="900.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Notes</text>
<text x="80.0" y="920.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">1. USB-C: the receptacle front face should end within 0.5 mm of the outer wall surface (connector overhangs</text>
<text x="80.0" y="940.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">   the PCB edge, or the wall is thinned locally); otherwise open the wall for the plug overmold (&gt;= 12.5 x 6.6 mm).</text>
<text x="80.0" y="960.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">2. Connector centre heights are nominal: take them from the Molex 105450-0101, HRO TYPE-C-31-M-12 and HanRun</text>
<text x="80.0" y="980.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">   HR911105A drawings once the layout house has placed the parts.</text>
<text x="80.0" y="1000.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">3. Wi-Fi: the Core1106 Wi-Fi variant has an IPEX 1.0 connector (ANT1), no usable on-module antenna is assumed.</text>
<text x="80.0" y="1020.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">   With an aluminium case use the RP-SMA bulkhead + IPEX pigtail, or an FPC antenna behind a plastic window.</text>
<text x="80.0" y="1040.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">4. Thermal: ~2 W of losses (bucks, LT7911D, RV1106); a 1-2 mm gap pad from the LT7911D/buck area to the lid</text>
<text x="80.0" y="1060.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">   or floor is recommended in an aluminium case (README risk H4).</text>
<text x="80.0" y="1080.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">5. Debug headers J501/J502/J503 are reached with the lid off; no wall opening is planned for them.</text>
</svg>
