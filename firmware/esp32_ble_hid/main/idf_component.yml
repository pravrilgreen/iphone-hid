## IDF Component Manager manifest
dependencies:
  idf: ">=5.4"
  # USB output (CONFIG_BRIDGE_OUTPUT_USB). Also fetched for the BLE build, where it is compiled but
  # never started or linked in. Version 1.x is the API this code and ESP-IDF 5.4's own tusb_hid
  # example use.
  espressif/esp_tinyusb:
    version: "^1.7.0"
    rules:
      - if: "target in [esp32s2, esp32s3]"
