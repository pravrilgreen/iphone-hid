[project]
name = "iphone-hid"
dynamic = ["version"]
description = "Python SDK for iphone-hid boxes: touch, keys, buttons and screenshots of real iPhones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License", "Development Status :: 3 - Alpha"]
dependencies = ["httpx"]

[project.optional-dependencies]
discovery = ["zeroconf"]  # Farm.discover(): find boxes on the local network
dev = ["iphone-hid[discovery]", "pytest", "pytest-timeout", "ruff"]
demo = ["playwright", "websockets", "imageio-ffmpeg"]  # scripts/record_demo.py: the demo videos

[project.scripts]
ihc = "ihc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ihc*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]
