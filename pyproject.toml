[project]
name = "iphone-hid"
version = "0.2.0"
description = "Control iPhones through external hardware only: video in over HDMI or USB-C, keyboard and mouse out over USB HID"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "httpx", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
# the box server (API, web console, video); the SDK needs none of these
server = ["fastapi", "uvicorn[standard]", "zeroconf", "opencv-python-headless", "numpy", "Pillow>=10.1"]
dev = ["iphone-hid[server]", "pytest", "pytest-timeout", "ruff"]

[project.scripts]
ihc = "ihc.cli:main"
ihc-hidtest = "ihc.tools.hidtest:main"
ihc-capture-check = "ihc.tools.capture_check:main"
ihc-hid-loopback = "ihc.tools.hid_loopback:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ihc*"]

[tool.setuptools.package-data]
ihc = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["slow: long end-to-end runs (e.g. a full Safari calibration); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# real errors only: syntax, undefined and unused names (the code base keeps its own formatting)
select = ["E9", "F"]
