[project]
name = "iphone-hid"
version = "0.1.2"
description = "Control an iPhone from a Linux host via HDMI capture and external HID hardware"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
video = ["opencv-python-headless", "numpy", "Pillow>=10.1"]
api = ["fastapi", "uvicorn[standard]", "httpx"]
dev = ["pytest", "pytest-timeout"]
box = ["zeroconf"]

[project.scripts]
ihc = "ihc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ihc*"]

[tool.pytest.ini_options]
markers = ["slow: long end-to-end runs (e.g. a full Safari calibration); deselect with -m 'not slow'"]
